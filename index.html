<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schooners Cams</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1b2430;
      --muted: #5b6776;
      --border: #dde3ea;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11161d;
        --card: #1a212b;
        --text: #e6ebf1;
        --muted: #95a1b0;
        --border: #2a3441;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    h1 { font-size: 1.4rem; margin: 0 0 16px; }
    .grid {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr));
    }
    .cam {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .cam h2 {
      font-size: 1rem;
      margin: 0;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cam h2 a { font-size: 0.8rem; font-weight: normal; color: var(--muted); }
    .frame { position: relative; aspect-ratio: 16 / 9; background: #000; }
    .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <h1>Schooners Live Cams</h1>
  <div class="grid" id="cams"></div>

  <script>
    // Stream pages hosted by Destination Network (the same ones schooners.com embeds).
    // The host rejects (403) requests whose Referer is not on its allowlist, so the
    // iframes send none. That can stop working if the host starts blocking that too.
    const CAMS = [
      { name: "Beach Cam",    src: "https://media5.tripsmarter.com/includes/schooners-beach-cam-responsive.php",    page: "https://schooners.com/multimedia/beachcam.htm" },
      { name: "Sunset Cam",   src: "https://media5.tripsmarter.com/includes/schooners-sunset-cam-responsive.php",   page: "https://schooners.com/multimedia/sunsetcam.htm" },
      { name: "Hill Bar Cam", src: "https://media5.tripsmarter.com/includes/schooners-hill-bar-cam-responsive.php", page: "https://schooners.com/multimedia/hillbarcam.htm" },
    ];

    const grid = document.getElementById("cams");
    for (const cam of CAMS) {
      const card = document.createElement("section");
      card.className = "cam";
      card.innerHTML = `
        <h2>${cam.name} <a href="${cam.page}" target="_blank" rel="noopener">schooners.com ↗</a></h2>
        <div class="frame">
          <iframe src="${cam.src}" title="${cam.name}" referrerpolicy="no-referrer" allow="autoplay; fullscreen" allowfullscreen loading="lazy"></iframe>
        </div>`;
      grid.appendChild(card);
    }
  </script>
</body>
</html>
